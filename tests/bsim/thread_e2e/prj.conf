# Thread provisioning BabbleSim E2E: the manager (Thread network type) + real
# OpenThread on the simulated nrf52_bsim 802.15.4 radio. No BLE — the handlers
# are driven directly (the BLE transport is covered by ble_e2e).
#
# SPDX-License-Identifier: Apache-2.0

# --- Provisioning manager (Thread) ----------------------------------------
CONFIG_NETWORK_PROV_MGR=y
# Cheapest transport to satisfy the ">=1 transport" requirement; never started.
CONFIG_NETWORK_PROV_CONSOLE=y
CONFIG_NETWORK_PROV_NETWORK_TYPE_THREAD=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n

# --- OpenThread (FTD) over the nrf52_bsim 802.15.4 radio ------------------
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_TCP=n
CONFIG_NET_IPV4=n
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_FTD=y
# The app provisions/forms the network itself; don't auto-start with defaults.
CONFIG_OPENTHREAD_MANUAL_START=y
CONFIG_OPENTHREAD_LOG_LEVEL_INFO=y

# --- Dataset persistence (OpenThread settings backend) --------------------
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# --- Crypto (security scheme 1; NETWORK_PROV_CORE depends on MBEDTLS) ------
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=16384
CONFIG_ENTROPY_GENERATOR=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ECC_MONTGOMERY_255=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_DERIVE=y
CONFIG_PSA_WANT_ALG_CTR=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_SHA_256=y

CONFIG_NANOPB=y

CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_LOG=y
