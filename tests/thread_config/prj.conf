# Thread prov-config handler integration build: the real manager (Thread network
# type) + OpenThread on a Thread-capable board. native_sim has no OpenThread
# radio driver, so this is a compile/link integration check on nrf52840dk
# (build_only); a full BabbleSim attach E2E is a follow-up.
#
# SPDX-License-Identifier: Apache-2.0

CONFIG_ZTEST=y

CONFIG_NETWORK_PROV_MGR=y
# Cheapest transport to satisfy the "at least one transport" requirement; the
# test drives the handler directly rather than over a transport.
CONFIG_NETWORK_PROV_CONSOLE=y
CONFIG_NETWORK_PROV_NETWORK_TYPE_THREAD=y

CONFIG_SHELL=y

# --- OpenThread (FTD) -----------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_FTD=y
# Don't auto-start the stack with defaults — provisioning supplies the dataset.
CONFIG_OPENTHREAD_MANUAL_START=y

# --- Dataset persistence (OpenThread settings backend) --------------------
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# --- Crypto (security scheme 1; NETWORK_PROV_CORE depends on MBEDTLS) ------
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=16384
CONFIG_ENTROPY_GENERATOR=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ECC_MONTGOMERY_255=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_DERIVE=y
CONFIG_PSA_WANT_ALG_CTR=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_SHA_256=y

CONFIG_NANOPB=y

CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_LOG=y
