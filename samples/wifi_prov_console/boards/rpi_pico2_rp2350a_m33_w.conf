# Raspberry Pi Pico 2W: run the console/shell over SEGGER RTT, read through the
# SWD debug probe with OpenOCD. The Pico 2W is already flashed/debugged over
# SWD, so RTT reuses that link — no UART wiring and no USB-CDC needed.
#
# (The USB-next CDC-ACM console hits an iterable-section .data-init fault on
# this board/Zephyr; RTT sidesteps the USB device stack entirely.)
#
# SPDX-License-Identifier: Apache-2.0

CONFIG_USE_SEGGER_RTT=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_RTT=y

# Handy on the console: inspect the network/Wi-Fi state and scan from the shell.
CONFIG_NET_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y
